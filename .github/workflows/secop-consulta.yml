name: Consulta SECOP II para ARTEC HIDRO
on:
  push:
    branches: [secop-consulta]
    paths: [tools/secop_artec.py, .github/workflows/secop-consulta.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/secop_artec.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add secop/data/consulta-artec.json
          git commit -m "Resultados consulta SECOP II $(date -u +%F)" || echo "sin cambios"
          git push
